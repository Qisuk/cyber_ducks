# Cyber Ducks range. DELIBERATELY INSECURE: run only on your own machine.
# Start:  docker compose up -d        Reset all data:  docker compose down -v
# Settings come from .env (copy .env.example to .env first).

name: cyber-ducks

# Every container logs to Docker's json-file driver. The `labels` option copies these container
# labels into each log line, so the collector knows which service and trust zone it came from.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service,range.zone,range.logs"

# OpenTelemetry settings shared by the .NET services (merged in with `<<: *otel`).
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

# Readiness check for the .NET services. The runtime image has no curl, so use bash's /dev/tcp.
x-http-health: &http-health
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  # --- Z3 Application ---------------------------------------------------------------------
  store-api:
    build: { context: ., dockerfile: src/Store.Api/Dockerfile }
    image: cyber-ducks/store-api:dev
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      # Vulnerable DB-role default: store_owner. store_app is the least-privilege alternative (VULN-DBROLE-01).
      ConnectionStrings__Store: Host=postgres;Database=duckstore;Username=store_owner;Password=${STORE_OWNER_PASSWORD}
      ConnectionStrings__StoreApp: Host=postgres;Database=duckstore;Username=store_app;Password=${STORE_APP_PASSWORD}
      ConnectionStrings__Flags: Host=postgres;Database=range_control;Username=flags_reader;Password=${FLAGS_READER_PASSWORD}
      # JWT signing secret (fake). VULN-SESSION-01 will add weakened variants beside this (step 3d).
      Jwt__Secret: ${JWT_SECRET}
      # Persona passwords, set on first start (fake). Mixed strength: alice/bob are weak on purpose.
      Personas__alice: ${PERSONA_ALICE_PASSWORD}
      Personas__bob: ${PERSONA_BOB_PASSWORD}
      Personas__carol: ${PERSONA_CAROL_PASSWORD}
      Personas__dave: ${PERSONA_DAVE_PASSWORD}
      Personas__eve: ${PERSONA_EVE_PASSWORD}
      Personas__mallory: ${PERSONA_MALLORY_PASSWORD}
      Personas__trent: ${PERSONA_TRENT_PASSWORD}
      PaymentStub__BaseUrl: http://payment-stub:8080/
      # Shared webhook secret (fake). VULN-WEBHOOK-01 decides whether the signature is checked.
      Webhook__Secret: ${WEBHOOK_SECRET}
      <<: *otel
      OTEL_SERVICE_NAME: store-api
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z3,service.namespace=cyber-ducks
    healthcheck: *http-health
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [range]

  store-web:
    build: { context: ., dockerfile: src/Store.Web/Dockerfile }
    image: cyber-ducks/store-web:dev
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      StoreApi__BaseUrl: http://store-api:8080/
      ConnectionStrings__Flags: Host=postgres;Database=range_control;Username=flags_reader;Password=${FLAGS_READER_PASSWORD}
      DataProtection__KeyPath: /keys
      # OAuth: Keycloak's public URL (browser/issuer) vs the internal address store-web uses.
      Oidc__PublicHost: localhost:${IDP_PORT:-8091}
      Oidc__InternalHost: idp:8080
      Oidc__GoogleSecret: ${OIDC_GOOGLE_SECRET}
      Oidc__MetaSecret: ${OIDC_META_SECRET}
      <<: *otel
      OTEL_SERVICE_NAME: store-web
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z3,service.namespace=cyber-ducks
    ports:
      # Temporary: published directly until the proxy (Z2) takes over this port in step 3e.
      - "127.0.0.1:${STORE_PORT:-8080}:8080"
    volumes:
      # Data Protection keys: login cookies survive restarts (decision 1).
      - webkeys:/keys
    healthcheck: *http-health
    depends_on:
      store-api: { condition: service_healthy }
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [range]

  # --- Z7 External providers --------------------------------------------------------------
  # Fake payment provider. Charges always succeed, then it calls store-api's webhook (flow F14).
  payment-stub:
    build: { context: ., dockerfile: src/PaymentStub/Dockerfile }
    image: cyber-ducks/payment-stub:dev
    labels: { range.zone: Z7, range.logs: otlp }
    environment:
      StoreApi__WebhookUrl: http://store-api:8080/api/payments/webhook
      Webhook__Secret: ${WEBHOOK_SECRET}
      <<: *otel
      OTEL_SERVICE_NAME: payment-stub
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z7,service.namespace=cyber-ducks
    healthcheck: *http-health
    depends_on:
      store-api: { condition: service_started }
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [range]

  # Local OIDC provider standing in for Google and Meta (ADR-0003). Two realms = two mock IdPs.
  # KC_HOSTNAME is the browser-facing URL (issuer); backchannel-dynamic lets store-web's container
  # reach it internally at idp:8080 (store-web rewrites the host).
  idp:
    image: quay.io/keycloak/keycloak:26.8.1
    labels: { range.zone: Z7 }
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${IDP_PORT:-8091}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${IDP_PORT:-8091}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [range]

  # --- Z5 Data ----------------------------------------------------------------------------
  postgres:
    image: postgres:18
    labels: { range.zone: Z5 }
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Passwords for the service roles created by 01-roles.sh.
      STORE_OWNER_PASSWORD: ${STORE_OWNER_PASSWORD}
      STORE_APP_PASSWORD: ${STORE_APP_PASSWORD}
      RANGE_CONTROL_PASSWORD: ${RANGE_CONTROL_PASSWORD}
      FLAGS_READER_PASSWORD: ${FLAGS_READER_PASSWORD}
      BACKUP_READER_PASSWORD: ${BACKUP_READER_PASSWORD}
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD}
    ports:
      # Bound to localhost only, never 0.0.0.0. Exposed so you can explore the DB with psql/pgAdmin.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives restarts, wiped by `docker compose down -v`.
      # (Postgres 18+ images keep data under /var/lib/postgresql.)
      - pgdata:/var/lib/postgresql
      # Scripts here run once, in filename order, only when the data volume is empty (ADR-0002).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Backups (read-only) and the restore script: restore runs here, as the superuser,
      # so the backup service never needs superuser credentials.
      - pgbackups:/backups:ro
      - ./infra/backup:/backup-scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # Safety rail: resource limits stay on even when the range is "vulnerable".
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    # On both networks: the store reaches it over `range`, range-control over the isolated `ops`.
    networks: [range, ops]

  # --- Z9 Range control -------------------------------------------------------------------
  # The defence-toggle panel (ADR-0008/0011). NOT an attack target: it sits on the isolated `ops`
  # network, so store services (on `range`) cannot reach it, while it can still reach postgres.
  range-control:
    build: { context: ., dockerfile: src/RangeControl/Dockerfile }
    image: cyber-ducks/range-control:dev
    labels: { range.zone: Z9, range.logs: otlp }
    environment:
      ConnectionStrings__RangeControl: Host=postgres;Database=range_control;Username=range_control_owner;Password=${RANGE_CONTROL_PASSWORD}
      ConnectionStrings__Duckstore: Host=postgres;Database=duckstore;Username=range_control_owner;Password=${RANGE_CONTROL_PASSWORD}
      Facilitator__Password: ${FACILITATOR_PASSWORD}
      DataProtection__KeyPath: /keys
      <<: *otel
      OTEL_SERVICE_NAME: range-control
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z9,service.namespace=cyber-ducks
    ports:
      - "127.0.0.1:${RANGE_CONTROL_PORT:-8090}:8080"
    volumes:
      - rangectlkeys:/keys
    healthcheck: *http-health
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [ops]

  # --- Z6 Backups -------------------------------------------------------------------------
  # Scheduled pg_dump of duckstore into the pgbackups volume (flow F17).
  backup:
    image: postgres:18
    labels: { range.zone: Z6 }
    entrypoint: ["bash", "/backup-scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: backup_reader
      PGPASSWORD: ${BACKUP_READER_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    volumes:
      - pgbackups:/backups
      - ./infra/backup:/backup-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [range]

  # --- Z8 Observability -------------------------------------------------------------------
  # Grafana + Loki (logs) + Prometheus (metrics) + Tempo (traces) in one image.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    labels: { range.zone: Z8 }
    environment:
      # VULNERABLE DEFAULT (decision 4): anyone reaching Grafana is an anonymous Admin.
      # Becomes an infra-kind defence toggle later (ADR-0011).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      ENABLE_LOGS_GRAFANA: "true"   # send Grafana's own logs to stdout (and so to Loki)
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Telemetry survives restarts: the wargame needs evidence (decision 5).
      - lgtmdata:/data
      - ./infra/grafana/dashboards:/otel-lgtm/range-dashboards:ro
      - ./infra/grafana/range-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/range.yaml:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    cpus: 2.0
    logging: *logging
    restart: unless-stopped
    networks: [range]

  # Single entry point for all telemetry (decision 1). No published ports: internal only.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    labels: { range.zone: Z8 }
    command: ["--config=/etc/otelcol/collector.yaml"]
    # Root is needed to read Docker's log files (decision 2). A telemetry agent with host
    # read access is a high-value target: see the threat model (Z8).
    user: "0:0"
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol-state:/var/lib/otelcol/file_storage
    depends_on:
      lgtm:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    # Also on ops so range-control (isolated) can still ship its telemetry here.
    networks: [range, ops]

  # Per-container CPU/memory/network metrics (decision 3). Needs read-only host access;
  # no published port.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    labels: { range.zone: Z8 }
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,range.zone
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [range]

  # Database health metrics, read with the pg_monitor-only metrics_reader role.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    labels: { range.zone: Z8 }
    environment:
      DATA_SOURCE_URI: "postgres:5432/duckstore?sslmode=disable"
      DATA_SOURCE_USER: metrics_reader
      DATA_SOURCE_PASS: ${METRICS_READER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    logging: *logging
    restart: unless-stopped
    networks: [range]

networks:
  # The store and its dependencies. Finer segmentation (DMZ vs internal) is a Phase 8 exercise.
  range: {}
  # Range control is kept off `range`, so store services can't reach the defence-toggle panel
  # (ADR-0011). Postgres and the collector bridge both; range-control sits here alone.
  ops: {}

volumes:
  pgdata: {}
  pgbackups: {}
  webkeys: {}
  rangectlkeys: {}
  lgtmdata: {}
  otelcol-state: {}
