# Cyber Ducks range. DELIBERATELY INSECURE: run only on your own machine.
# Start:  docker compose up -d        Reset all data:  docker compose down -v
# Settings come from .env (copy .env.example to .env first).

name: cyber-ducks

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Passwords for the service roles created by 01-roles.sh.
      STORE_OWNER_PASSWORD: ${STORE_OWNER_PASSWORD}
      STORE_APP_PASSWORD: ${STORE_APP_PASSWORD}
      RANGE_CONTROL_PASSWORD: ${RANGE_CONTROL_PASSWORD}
      FLAGS_READER_PASSWORD: ${FLAGS_READER_PASSWORD}
      BACKUP_READER_PASSWORD: ${BACKUP_READER_PASSWORD}
    ports:
      # Bound to localhost only, never 0.0.0.0. Exposed so you can explore the DB with psql/pgAdmin.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives restarts, wiped by `docker compose down -v`.
      # (Postgres 18+ images keep data under /var/lib/postgresql.)
      - pgdata:/var/lib/postgresql
      # Scripts here run once, in filename order, only when the data volume is empty (ADR-0002).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Backups (read-only) and the restore script: restore runs here, as the superuser,
      # so the backup service never needs superuser credentials.
      - pgbackups:/backups:ro
      - ./infra/backup:/backup-scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # Safety rail: resource limits stay on even when the range is "vulnerable".
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks: [range]

  # Scheduled pg_dump of duckstore into the pgbackups volume (zone Z6, flow F17).
  backup:
    image: postgres:18
    entrypoint: ["bash", "/backup-scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: backup_reader
      PGPASSWORD: ${BACKUP_READER_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    volumes:
      - pgbackups:/backups
      - ./infra/backup:/backup-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    networks: [range]

networks:
  # Single flat network for the alpha. Splitting it into trust zones is a Phase 8 defence exercise.
  range: {}

volumes:
  pgdata: {}
  pgbackups: {}
