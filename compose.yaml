# Cyber Ducks range. DELIBERATELY INSECURE: run only on your own machine.
# Start:  docker compose up -d        Reset all data:  docker compose down -v
# Settings come from .env (copy .env.example to .env first).

name: cyber-ducks

# Every container logs to Docker's json-file driver. The `labels` option copies these container
# labels into each log line, so the collector knows which service and trust zone it came from.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service,range.zone,range.logs"

# OpenTelemetry settings shared by the .NET services (merged in with `<<: *otel`).
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

# Readiness check for the .NET services. The runtime image has no curl, so use bash's /dev/tcp.
x-http-health: &http-health
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  # --- Z2 Edge ----------------------------------------------------------------------------
  # Single entry point on 127.0.0.1:${STORE_PORT}. Reverse-proxies store-web and runs a curated,
  # teaching WAF (VULN-WAF-01). Deliberately URL/header-only — it does not inspect request bodies.
  proxy:
    image: nginx:1.27-alpine
    labels: { range.zone: Z2 }
    environment:
      # VULN-WAF-01 (infra toggle): "off" = log-only (range default), "on" = block matches with 403.
      WAF_ENFORCE: ${WAF_ENFORCE:-off}
      # Only substitute WAF_* placeholders in the template; leave nginx's own $vars alone.
      NGINX_ENVSUBST_FILTER: WAF_
    volumes:
      - ./infra/proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${STORE_BIND_IP:-127.0.0.1}:${STORE_PORT:-8080}:80" # accessible on lan
      - "127.0.0.1:${STORE_PORT:-8080}:80" # only accessible on local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      store-web: { condition: service_healthy }
    mem_limit: 32m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [edge]

  # --- Z3 Application ---------------------------------------------------------------------
  store-api:
    build: { context: ., dockerfile: src/Store.Api/Dockerfile }
    image: cyber-ducks/store-api:dev
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      # Vulnerable DB-role default: store_owner. store_app is the least-privilege alternative (VULN-DBROLE-01).
      ConnectionStrings__Store: Host=postgres;Database=duckstore;Username=store_owner;Password=${STORE_OWNER_PASSWORD}
      ConnectionStrings__StoreApp: Host=postgres;Database=duckstore;Username=store_app;Password=${STORE_APP_PASSWORD}
      ConnectionStrings__Flags: Host=postgres;Database=range_control;Username=flags_reader;Password=${FLAGS_READER_PASSWORD}
      # JWT signing secret (fake). VULN-SESSION-01 will add weakened variants beside this (step 3d).
      Jwt__Secret: ${JWT_SECRET}
      # Persona passwords, set on first start (fake). Mixed strength: alice/bob are weak on purpose.
      Personas__alice: ${PERSONA_ALICE_PASSWORD}
      Personas__bob: ${PERSONA_BOB_PASSWORD}
      Personas__carol: ${PERSONA_CAROL_PASSWORD}
      Personas__dave: ${PERSONA_DAVE_PASSWORD}
      Personas__eve: ${PERSONA_EVE_PASSWORD}
      Personas__mallory: ${PERSONA_MALLORY_PASSWORD}
      Personas__trent: ${PERSONA_TRENT_PASSWORD}
      PaymentStub__BaseUrl: http://payment-stub:8080/
      # Shared webhook secret (fake). VULN-WEBHOOK-01 decides whether the signature is checked.
      Webhook__Secret: ${WEBHOOK_SECRET}
      <<: *otel
      OTEL_SERVICE_NAME: store-api
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z3,service.namespace=cyber-ducks
    ports:
      # Published (localhost only) so the API attack surface can be tested directly, e.g. with an
      # intercepting proxy or the attacks/ probes. A real deployment would keep it behind the proxy.
      - "127.0.0.1:${STORE_API_PORT:-8081}:8080"
    healthcheck: *http-health
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [svc, data]

  store-web:
    build: { context: ., dockerfile: src/Store.Web/Dockerfile }
    image: cyber-ducks/store-web:dev
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      StoreApi__BaseUrl: http://store-api:8080/
      # The chat agent (flow F5). No depends_on: the store still works if the agent is down.
      AiAgent__BaseUrl: http://ai-agent:8080/
      ConnectionStrings__Flags: Host=postgres;Database=range_control;Username=flags_reader;Password=${FLAGS_READER_PASSWORD}
      DataProtection__KeyPath: /keys
      # OAuth: Keycloak's public URL (browser/issuer) vs the internal address store-web uses.
      Oidc__PublicHost: localhost:${IDP_PORT:-8091}
      Oidc__InternalHost: idp:8080
      Oidc__GoogleSecret: ${OIDC_GOOGLE_SECRET}
      Oidc__MetaSecret: ${OIDC_META_SECRET}
      # Admin creds so store-web can set the redirect-URI policy at startup (VULN-OAUTH-02).
      Keycloak__AdminUser: ${KEYCLOAK_ADMIN_USER:-admin}
      Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD}
      <<: *otel
      OTEL_SERVICE_NAME: store-web
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z3,service.namespace=cyber-ducks
    # No published port: the edge proxy (Z2) now owns ${STORE_PORT} and is the only way in.
    # Reach store-web directly from another container at http://store-web:8080.
    expose:
      - "8080"
    volumes:
      # Data Protection keys: login cookies survive restarts (decision 1).
      - webkeys:/keys
    healthcheck: *http-health
    depends_on:
      store-api: { condition: service_healthy }
      idp: { condition: service_healthy } # for the startup redirect-URI configuration
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [edge, svc, agent, flags]

  # Z3b tool gateway: the agent's only route to any API (ADR-0009). Calls store-api as the
  # customer (flow F22). Exposes the MCP endpoint at /mcp over Streamable HTTP; no public port.
  agent-tools:
    build: { context: ., dockerfile: src/AgentTools/Dockerfile }
    image: cyber-ducks/agent-tools:dev
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      ConnectionStrings__Flags: Host=postgres;Database=range_control;Username=flags_reader;Password=${FLAGS_READER_PASSWORD}
      StoreApi__BaseUrl: http://store-api:8080/
      # VULN-MCP-01 vulnerable path: the shared service account agent-tools logs in as (a seeded
      # persona with orders, so the cross-account leak is visible). Fake range credential.
      AgentTools__ServiceAccount__Email: bob@duckstore.test
      AgentTools__ServiceAccount__Password: ${PERSONA_BOB_PASSWORD:-letmein}
      <<: *otel
      OTEL_SERVICE_NAME: agent-tools
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z3,service.namespace=cyber-ducks
    healthcheck: *http-health
    depends_on:
      store-api: { condition: service_healthy }
      otel-collector: { condition: service_started }
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [svc, agent, flags]

  # Z3a agent (untrusted): the customer chat agent. Reaches data only via agent-tools (flow F8).
  # No public port; store-web calls it internally and forwards the customer's JWT (flow F5).
  ai-agent:
    build: { context: ., dockerfile: src/AiAgent/Dockerfile }
    image: cyber-ducks/ai-agent:dev
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      ConnectionStrings__Flags: Host=postgres;Database=range_control;Username=flags_reader;Password=${FLAGS_READER_PASSWORD}
      AgentTools__McpUrl: http://agent-tools:8080/mcp
      # LLM provider (ADR-0010). Defaults to the local ollama container; override in .env for cloud.
      Llm__Provider: ${Llm__Provider:-Ollama}
      Llm__Model: ${Llm__Model:-qwen3:4b-instruct}
      Llm__Endpoint: ${Llm__Endpoint:-}
      Llm__ApiKey: ${Llm__ApiKey:-}
      Llm__TimeoutSeconds: ${Llm__TimeoutSeconds:-300}
      Llm__Think: ${Llm__Think:-false} # Ollama/qwen3 reasoning mode; slow on CPU
      Llm__Threads: "4" # keep equal to ollama's `cpus` limit, or the CFS quota throttles inference
      <<: *otel
      OTEL_SERVICE_NAME: ai-agent
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z3,service.namespace=cyber-ducks
    healthcheck: *http-health
    depends_on:
      agent-tools: { condition: service_healthy }
      otel-collector: { condition: service_started }
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [agent, flags]

  # Local LLM inference (ADR-0004/0010), CPU-only. In the `local-llm` profile (on by default via
  # COMPOSE_PROFILES in .env); clear it for cloud-LLM runs to save ~3-4 GB of RAM. Pulls the model
  # on first start into a named volume, then serves. ai-agent connects lazily, so a slow first pull
  # just delays the first chat. The `agent` net is sealed (internal: true) — seed the model before
  # sealing (it's cached in the `ollama` volume); offline, the entrypoint skips the pull and serves.
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    labels: { range.zone: Z3, range.logs: otlp }
    environment:
      # Keep one model resident: loading 2.5 GB from the volume takes ~1.5 min on this host.
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
    entrypoint:
      - /bin/sh
      - -c
      # Pull only if the model isn't already in the volume: the `agent` net is sealed (internal),
      # so a registry pull would just fail — a cached model serves fine offline.
      - 'ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama list | grep -q "${Llm__Model:-qwen3:4b-instruct}" || ollama pull ${Llm__Model:-qwen3:4b-instruct}; wait $$pid'
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 6g
    cpus: 4.0
    logging: *logging
    restart: unless-stopped
    # Wait for the seeder to put the model in the volume: the `agent` net is sealed, so this
    # container can't pull it itself. On later boots the seeder finds it cached and exits at once.
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    networks: [agent]

  # One-shot model seeder. The `agent` net is sealed (internal), so ollama can't reach the registry;
  # this runs on `bootstrap` (which has egress), pulls the model into the shared `ollama` volume if
  # it isn't there yet, then exits. Idempotent: a cached model means an instant no-op. This is how a
  # fresh deployment gets its model — seal protects the running range, the seeder bootstraps it.
  ollama-init:
    image: ollama/ollama:latest
    profiles: [local-llm]
    labels: { range.zone: Z3 }
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama list | grep -q "${Llm__Model:-qwen3:4b-instruct}" || ollama pull ${Llm__Model:-qwen3:4b-instruct}; ollama list | grep -q "${Llm__Model:-qwen3:4b-instruct}"; rc=$$?; kill $$pid 2>/dev/null; exit $$rc'
    volumes:
      - ollama:/root/.ollama
    mem_limit: 2g
    cpus: 2.0
    logging: *logging
    restart: "no"
    networks: [bootstrap]

  # --- Z7 External providers --------------------------------------------------------------
  # Fake payment provider. Charges always succeed, then it calls store-api's webhook (flow F14).
  payment-stub:
    build: { context: ., dockerfile: src/PaymentStub/Dockerfile }
    image: cyber-ducks/payment-stub:dev
    labels: { range.zone: Z7, range.logs: otlp }
    environment:
      StoreApi__WebhookUrl: http://store-api:8080/api/payments/webhook
      Webhook__Secret: ${WEBHOOK_SECRET}
      <<: *otel
      OTEL_SERVICE_NAME: payment-stub
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z7,service.namespace=cyber-ducks
    healthcheck: *http-health
    depends_on:
      store-api: { condition: service_started }
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [svc]

  # Decoy "internal admin / data export" server (VULN-HONEYPOT-01). Nothing legitimate uses it; it is
  # only linked from the store as bait. Every request logs a loud "HONEYPOT HIT" line → Loki → a
  # Grafana alert → the wargame detected map. On `edge` so the proxy can route decoy paths to it (a
  # browser following the bait), and on `svc` so agent-tools can reach it for the egress/exfil demo.
  honeypot:
    build: { context: ., dockerfile: src/Honeypot/Dockerfile }
    image: cyber-ducks/honeypot:dev
    labels: { range.zone: Z7, range.logs: otlp }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: honeypot
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z7,service.namespace=cyber-ducks
    healthcheck: *http-health
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [edge, svc]

  # Local OIDC provider standing in for Google and Meta (ADR-0003). Two realms = two mock IdPs.
  # KC_HOSTNAME is the browser-facing URL (issuer); backchannel-dynamic lets store-web's container
  # reach it internally at idp:8080 (store-web rewrites the host).
  idp:
    image: quay.io/keycloak/keycloak:26.8.1
    labels: { range.zone: Z7 }
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${IDP_PORT:-8091}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${IDP_PORT:-8091}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    networks: [svc]

  # --- Z5 Data ----------------------------------------------------------------------------
  postgres:
    image: postgres:18
    labels: { range.zone: Z5 }
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Passwords for the service roles created by 01-roles.sh.
      STORE_OWNER_PASSWORD: ${STORE_OWNER_PASSWORD}
      STORE_APP_PASSWORD: ${STORE_APP_PASSWORD}
      RANGE_CONTROL_PASSWORD: ${RANGE_CONTROL_PASSWORD}
      FLAGS_READER_PASSWORD: ${FLAGS_READER_PASSWORD}
      BACKUP_READER_PASSWORD: ${BACKUP_READER_PASSWORD}
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD}
    ports:
      # Bound to localhost only, never 0.0.0.0. Exposed so you can explore the DB with psql/pgAdmin.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives restarts, wiped by `docker compose down -v`.
      # (Postgres 18+ images keep data under /var/lib/postgresql.)
      - pgdata:/var/lib/postgresql
      # Scripts here run once, in filename order, only when the data volume is empty (ADR-0002).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Backups (read-only) and the restore script: restore runs here, as the superuser,
      # so the backup service never needs superuser credentials.
      - pgbackups:/backups:ro
      - ./infra/backup:/backup-scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # Safety rail: resource limits stay on even when the range is "vulnerable".
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    restart: unless-stopped
    # Data tier (sealed) + ops so range-control can read flags/wargame.
    networks: [data, ops, flags]

  # --- Z9 Range control -------------------------------------------------------------------
  # The defence-toggle panel (ADR-0008/0011). NOT an attack target: it sits on `ops` (plus `obs` to
  # query Grafana, flow F19), so store services on the application tiers cannot reach it, while it
  # can still reach postgres and the observability stack.
  range-control:
    build: { context: ., dockerfile: src/RangeControl/Dockerfile }
    image: cyber-ducks/range-control:dev
    labels: { range.zone: Z9, range.logs: otlp }
    environment:
      ConnectionStrings__RangeControl: Host=postgres;Database=range_control;Username=range_control_owner;Password=${RANGE_CONTROL_PASSWORD}
      ConnectionStrings__Duckstore: Host=postgres;Database=duckstore;Username=range_control_owner;Password=${RANGE_CONTROL_PASSWORD}
      Facilitator__Password: ${FACILITATOR_PASSWORD}
      DataProtection__KeyPath: /keys
      # Flow F19: poll Grafana's firing detection alerts to drive the wargame's detected layer.
      # Grafana__ApiToken is only needed when anonymous access is off (VULN-GRAFANA-01 secure).
      Grafana__BaseUrl: http://lgtm:3000
      <<: *otel
      OTEL_SERVICE_NAME: range-control
      OTEL_RESOURCE_ATTRIBUTES: range.zone=Z9,service.namespace=cyber-ducks
    ports:
      - "127.0.0.1:${RANGE_CONTROL_PORT:-8090}:8080"
    volumes:
      - rangectlkeys:/keys
      # Wargame (ADR-0008): the map is drawn from the topology; scenarios are editable files.
      - ./infra/topology.yaml:/range/topology.yaml:ro
      - ./wargame:/range/wargame:ro
      # Per-defence teaching detail (attack sim + mitigation), editable without a rebuild.
      - ./infra/defence-details.yaml:/range/defence-details.yaml:ro
    healthcheck: *http-health
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    # ops: reach postgres/collector for flags + wargame. obs: query Grafana alert state (flow F19).
    networks: [ops, obs]

  # --- Z6 Backups -------------------------------------------------------------------------
  # Scheduled pg_dump of duckstore into the pgbackups volume (flow F17).
  backup:
    image: postgres:18
    labels: { range.zone: Z6 }
    entrypoint: ["bash", "/backup-scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: backup_reader
      PGPASSWORD: ${BACKUP_READER_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    volumes:
      - pgbackups:/backups
      - ./infra/backup:/backup-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [data]

  # --- Z8 Observability -------------------------------------------------------------------
  # Grafana + Loki (logs) + Prometheus (metrics) + Tempo (traces) in one image.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    labels: { range.zone: Z8 }
    environment:
      # VULN-GRAFANA-01 (infra toggle, ADR-0011). VULNERABLE DEFAULT (decision 4): anyone
      # reaching Grafana is an anonymous Admin. Secure: set GRAFANA_ANONYMOUS=false in .env and
      # restart lgtm — anonymous access is off and the admin login (admin/admin by default) is
      # required. Infra kind: the panel shows the intended state; the env + restart makes it real.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      ENABLE_LOGS_GRAFANA: "true"   # send Grafana's own logs to stdout (and so to Loki)
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Telemetry survives restarts: the wargame needs evidence (decision 5).
      - lgtmdata:/data
      - ./infra/grafana/dashboards:/otel-lgtm/range-dashboards:ro
      - ./infra/grafana/range-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/range.yaml:ro
      # Phase 8a: provisioned alert rules (detections/*.md as firing alerts).
      - ./infra/grafana/alerting/range-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/range-alerts.yaml:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    cpus: 2.0
    logging: *logging
    restart: unless-stopped
    networks: [obs]

  # Single entry point for all telemetry (decision 1). No published ports: internal only.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    labels: { range.zone: Z8 }
    command: ["--config=/etc/otelcol/collector.yaml"]
    # Root is needed to read Docker's log files (decision 2). A telemetry agent with host
    # read access is a high-value target: see the threat model (Z8).
    user: "0:0"
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol-state:/var/lib/otelcol/file_storage
    depends_on:
      lgtm:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    # Telemetry hub: svc + agent tiers send OTLP here; obs reaches lgtm/cadvisor/exporter; ops for range-control.
    networks: [svc, agent, obs, ops]

  # Per-container CPU/memory/network metrics (decision 3). Needs read-only host access;
  # no published port.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    labels: { range.zone: Z8 }
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,range.zone
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped
    networks: [obs]

  # Database health metrics, read with the pg_monitor-only metrics_reader role.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    labels: { range.zone: Z8 }
    environment:
      DATA_SOURCE_URI: "postgres:5432/duckstore?sslmode=disable"
      DATA_SOURCE_USER: metrics_reader
      DATA_SOURCE_PASS: ${METRICS_READER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    logging: *logging
    restart: unless-stopped
    networks: [data, obs]

networks:
  # Phase 8d segmentation: the flat `range` net is split into trust tiers. A service reaches
  # another only when they share a network; otherwise the connection is refused at L3.
  edge:  {}            # DMZ: proxy <-> store-web. Only the proxy publishes a host port.
  svc:   {}            # service tier: store-web, store-api, agent-tools, idp, payment-stub
  agent:
    internal: true     # agent sandbox (TB5): ai-agent + ollama. Sealed — no route off the host, so
                       # a prompt-injected agent cannot exfiltrate or call home. agent-tools and
                       # store-web bridge to the service tier; the collector bridges to obs (ADR-0009).
  data:
    internal: true     # data tier: postgres + backup + exporter. No route off the host at all.
  obs:   {}            # observability: collector <-> lgtm / cadvisor / postgres-exporter
  bootstrap: {}        # egress-only, for the one-shot ollama-init model seeder (the `agent` net is sealed)
  flags:
    internal: true     # flag-sync only: store-web/agent-tools/ai-agent reach range_control (flags_reader,
                       # SELECT on defence_flags) without gaining egress — the agent seal stays intact.
  # Range control stays off every store tier, so store services can't reach the defence-toggle
  # panel (ADR-0011). Postgres and the collector bridge in; range-control sits here alone.
  ops:   {}

volumes:
  pgdata: {}
  pgbackups: {}
  webkeys: {}
  rangectlkeys: {}
  lgtmdata: {}
  otelcol-state: {}
  ollama: {}
