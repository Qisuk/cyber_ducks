# Wargame scenario (ADR-0008). Hybrid tabletop: players may investigate the real range telemetry
# in Grafana, but decide at tabletop level. The facilitator releases injects from the Ops Console;
# `at_minute` is the suggested time after the exercise starts. Phases follow NIST SP 800-61r2.
#
# Centres on VULN-AUTH-01 (no login throttling or lockout) enabling credential stuffing and account
# takeover; related VULN-SESSION-01 (session/token handling). The "Login 401 spike" alert
# (detections/VULN-AUTH-01.md) raises store-api on the detected map via the Grafana bridge once the
# failed-login rate crosses the threshold.

id: credential-stuffing
title: "A flood at the duck pond"
summary: Overnight, login attempts spike into the thousands and a handful of customers report orders they didn't place.
duration_minutes: 75

briefing: |
  Rubber Duck Emporium Ltd is a small UK online retailer (12 staff, ~4,000 customers). Customers
  sign in with email and password to see order history and saved delivery addresses, and can place
  orders against saved payment-card references. It is a UK GDPR data controller.

  It is Monday, 08:00. The overnight on-call was paged by a login-error alert, and the support inbox
  has a few "I didn't order this" and "I'm locked out of my account" messages. You are the incident
  response team. Log every decision and its reason in the Ops Console. Grafana
  (http://localhost:3000) has the shop's logs, traces and metrics.

injects:
  - id: I1
    at_minute: 0
    phase: detection_analysis
    audience: [all]
    from: On-call engineer
    title: Huge spike in failed logins
    body: |
      "Failed logins on /api/auth/login jumped from a trickle to thousands per hour overnight, from
      many IPs but a predictable pattern — one attempt per account, marching through a list of email
      addresses. A small fraction succeeded. This looks like credential stuffing."

  - id: I2
    at_minute: 10
    phase: detection_analysis
    audience: [tech_lead, incident_commander]
    from: Security analyst
    title: Some of them got in
    body: |
      "Cross-referencing: a few hundred logins succeeded after a failure burst on the same account.
      At least a dozen of those sessions then viewed order history and changed a delivery address.
      There is no rate limit or lockout on login, so the attacker could try freely."

  - id: I3
    at_minute: 18
    phase: detection_analysis
    audience: [comms, exec, incident_commander]
    from: Customer support
    title: Reports of fraud and lockouts
    body: |
      "Three customers say orders were placed to addresses that aren't theirs. Two more can't log in
      — possibly because the attacker changed their details. Volume is low but rising, and one has
      mentioned their bank and Twitter."

  - id: I4
    at_minute: 28
    phase: containment_eradication_recovery
    audience: [tech_lead, incident_commander]
    from: Engineering
    title: How do we stop the stuffing?
    body: |
      "Options: turn on login throttling and lockout (in the range: flip VULN-AUTH-01 to secure in
      Range Control); force-expire sessions; require re-auth for address/payment changes. What do we
      do first, and how do we avoid locking out the real customers whose accounts are being targeted?"

  - id: I5
    at_minute: 38
    phase: containment_eradication_recovery
    audience: [legal_dpo, incident_commander]
    from: Data Protection Officer
    title: Takeovers and reportability
    body: |
      "Where accounts were actually accessed by someone else, personal data (addresses, order
      history) was exposed and in some cases altered. How many confirmed takeovers, and when did we
      become aware? That decides ICO notification and whether those customers must be told directly."

  - id: I6
    at_minute: 48
    phase: containment_eradication_recovery
    audience: [exec, comms]
    from: Managing Director
    title: What do we tell customers?
    body: |
      "I don't want to panic 4,000 people if only a few dozen are affected — but I won't hide a real
      takeover either. Recommend who we contact, what we ask them to do, and whether we force a
      password reset for everyone. I need it in 15 minutes."

  - id: I7
    at_minute: 60
    phase: containment_eradication_recovery
    audience: [tech_lead, incident_commander]
    from: Engineering
    title: Did the fix hold?
    body: |
      "Throttling is on and affected sessions are expired. How do we verify stuffing is actually
      being blocked now (not just quieter), and how do we spot the attacker switching tactics —
      slower attempts, new IPs, or hitting the saved-card checkout directly?"

  - id: I8
    at_minute: 72
    phase: post_incident
    audience: [all]
    from: Board
    title: Lessons learned
    body: |
      "One page: what happened, how many accounts were actually taken over, how we found out, what
      we changed, and what we'll do before the next sale — including whether we offer multi-factor
      login."

# Facilitator-only. Not shown to players.
facilitator_notes: |
  Ground truth: login has no throttling or lockout (VULN-AUTH-01 vulnerable), so reused-password
  accounts fall to credential stuffing. A subset of accounts are genuinely taken over; the attacker
  viewed order history and changed delivery addresses on some. This is an availability + integrity +
  confidentiality incident, but narrow in scope (dozens, not thousands). Suggested ground-truth map:
  store-api = compromised, idp = normal (this is local email/password login, not OAuth), store-web =
  suspected (session handling, VULN-SESSION-01), postgres = normal (no bulk DB read). Set at start;
  reveal only in the debrief.

  Live tie-in: generating a burst of failed logins trips the "Login 401 spike" alert, and the Grafana
  bridge raises store-api to suspected on the DETECTED map — compare with the ground truth.

  Key decision points to look for:
  - Distinguishing stuffing (many accounts, one try each) from brute force (one account, many tries)
    from the telemetry, and sizing the real takeover count before acting.
  - Containment order: throttle/lockout (VULN-AUTH-01 -> secure), expire sessions, re-auth on
    sensitive changes — without mass-locking the targeted real users.
  - DPO: only confirmed-accessed accounts are a personal-data breach; awareness time recorded.
  - Comms proportionate: targeted reset for affected users vs a blanket reset; clear fraud guidance.
  - Verification that stuffing is blocked and monitoring for a tactic switch.

debrief_questions:
  - How did you tell credential stuffing apart from a brute-force attack, and from legitimate traffic?
  - How many accounts were actually taken over versus merely attempted, and how did you establish that?
  - Did the lack of rate limiting change the blast radius — and would MFA have prevented the takeovers?
  - Which control detected this, and how quickly could it have detected it with better thresholds?
